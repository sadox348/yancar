agv_task_controller:
  ros__parameters:
    # Goals are rejected unless their PoseStamped header uses this frame.
    goal_frame: odom
    control_rate: 10.0
    odom_timeout: 0.5
    max_linear: 0.25
    max_angular: 0.8
    linear_gain: 0.8
    angular_gain: 1.8
    distance_tolerance: 0.05
    heading_tolerance: 0.15
